name: (📡) Verify

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    branches-ignore:
      - "main"
  workflow_dispatch:

jobs:
  verify:
    uses: sitepark/github-project-workflow/.github/workflows/pnpm-verify.yml@main
    with:
      nodeVersion: "24"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
